<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тест по C#</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <header class="bg-dark text-white py-4">
        <div class="container text-center">
            <h1>Тест по C#</h1>
            <p class="mb-0">Проверь свои знания программирования</p>
        </div>
    </header>

    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <section class="card shadow-sm">
                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span id="questionCounter" class="text-muted">
                                Загрузка вопросов...
                            </span>

                            <span id="timer" class="badge bg-primary fs-6">
                                10:00
                            </span>
                        </div>

                        <div class="progress mb-4" role="progressbar"
                             aria-label="Прогресс теста">
                            <div
                                id="progressBar"
                                class="progress-bar"
                                style="width: 0%"
                            ></div>
                        </div>

                        <div id="questionContainer">

                            <div class="text-center py-4">
                                <div class="spinner-border text-primary"></div>
                                <p class="mt-3">Загружаем вопросы...</p>
                            </div>

                        </div>

                        <div id="navigation" class="d-flex justify-content-between mt-4">
                            <button id="prevBtn" class="btn btn-outline-secondary" disabled>
                                Назад
                            </button>

                            <button id="nextBtn" class="btn btn-primary" disabled>
                                Далее
                            </button>
                        </div>

                        <div id="result" class="mt-4"></div>

                    </div>
                </section>

                <div class="card mt-4 shadow-sm">
                    <div class="card-body text-center">
                        <h5>О проекте</h5>

                        <p class="text-muted mb-1">
                            Динамический тест с использованием JavaScript,
                            Bootstrap и Google Sheets.
                        </p>

                        <p class="mb-0">
                            Разработчик: Артемий Неделько
                        </p>

                        <p class="mb-0">
                            Группа: ИС-3.2
                        </p>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">Практическая работа по C#</p>
    </footer>

</body>
</html>
